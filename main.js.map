<div class="container-fluid">
    <form (ngSubmit)="handleCreateTodo()">
    <div class="form-group">
        <label for="title">Enter Your TODO Title</label>
        <input type="text" class="form-control" id="title" [(ngModel)]="title" aria-describedby="emailHelp" name="title" ngClass="">
    </div>
    <div class="form-group">
        <label for="description">Enter your TODO Description</label>
        <input type="text" class="form-control" id="description" name="desc" [(ngModel)]="description" >
    </div>
    <button type="submit" class="btn btn-primary" >Create TODO</button>
    </form>
</div>
