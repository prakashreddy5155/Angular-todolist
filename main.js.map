<h3>Create Your TODO</h3>
<app-create-todo (todoCreate)="handleCreateTodo($event)"></app-create-todo>



<h3>Your TODOs</h3>

<div *ngIf="todos.length === 0; else elseBlock">
    No TODOS to Display
</div>

<ng-template #elseBlock>
    <ul>
        <li *ngFor="let todo of todos">
            <app-todo-item [Todo]="todo" (todoDelete)="handleDelete($event)" (todoCheckBox)="handleStrikeThrough($event)"> </app-todo-item>
        </li>
    </ul>
</ng-template>
